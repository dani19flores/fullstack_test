{% comment %}
Partial reutilizable: recibe "label", "value" y "accent" a través de
{% include %} ... with, y no depende de nada más del contexto del padre.
{% endcomment %}
<div class="bg-white rounded-lg border border-gray-200 shadow-sm p-5">
    <p class="text-sm font-medium text-gray-500">{{ label }}</p>
    <p class="mt-1 text-2xl font-bold
        {% if accent == 'green' %}text-green-600
        {% elif accent == 'amber' %}text-amber-600
        {% else %}text-blue-600
        {% endif %}">{{ value }}</p>
</div>
