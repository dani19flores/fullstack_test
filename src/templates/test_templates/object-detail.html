<div class="mb-6">
    <h1 class="text-2xl font-bold text-gray-900">{{ object_title }}</h1>
    <p class="text-sm text-gray-500">Detalle del objeto</p>
</div>

<div class="bg-white rounded-lg border border-gray-200 shadow-sm divide-y divide-gray-100">
    <div class="flex items-center justify-between px-5 py-4">
        <span class="text-sm font-medium text-gray-500">Precio</span>
        <span class="text-sm font-semibold text-gray-900">{{ price|floatformat:2 }} USD</span>
    </div>
    <div class="flex items-center justify-between px-5 py-4">
        <span class="text-sm font-medium text-gray-500">Creado</span>
        <span class="text-sm font-semibold text-gray-900">{{ created_at|date:"Y-m-d" }}</span>
    </div>
</div>
