databases:
  - name: fullstack-test-db
    plan: free
    region: oregon

services:
  - type: web
    name: fullstack-test-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /up
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: USE_REDIS
        value: "false"
      - key: ALLOWED_HOSTS
        value: ".localhost,127.0.0.1,[::1]"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://dani19flores.github.io"
      - key: POSTGRES_DB
        fromDatabase:
          name: fullstack-test-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: fullstack-test-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: fullstack-test-db
          property: password
      - key: POSTGRES_HOST
        fromDatabase:
          name: fullstack-test-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: fullstack-test-db
          property: port
